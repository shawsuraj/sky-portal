{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }

        .page-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .sidebar {
            width: 250px;
            min-height: 100%;
        }

        .main-content {
            flex: 1;
            padding: 24px;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .messages-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages-box {
            background: white;

            border: 1px solid #ddd;
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages-frame {
            width: 100%;
            flex: 1;
            min-height: 650px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            display: block;
        }

        footer {
            background: white;
        }

        .app-sidebar {

                position: static;

                width: 100%;

                height: auto;

                overflow: visible;

            }

            .app-main {

                margin-left: 0;

                height: auto;

                overflow: visible;

            }

            .portal-sidebar {

                width: 100%;

                height: auto;

                min-height: auto;

            }
            .app-sidebar {

            position: fixed;

            top: 0;

            left: 0;

            z-index: 9999;

            width: 250px;

            height: 100vh;

            overflow-y: auto;

        }

        .app-main {

            margin-left: 250px;

            height: 100vh;

            overflow-y: auto;

        }

        .portal-sidebar {

            width: 100%;

            height: 100%;

            min-height: 100%;

            margin: 0;

            padding: 0;

        }

        .portal-sidebar-inner {

            padding: 1rem 2rem;

            min-height: 100%;

        }

        .main-board {

            margin: 0;

            min-height: 100%;

        }

        .portal-search-wrap {

            max-width: 600px;

            width: 100%;

        }

        .portal-search-input {

            border: 2px solid #4b4b4b;

            font-size: 1rem;

        }

        .profile-avatar {

            width: 35px;

            height: 35px;

            border: 1px solid #4b4b4b;

            border-radius: 50%;

            background: #ffffff;

            display: inline-block;

        }
    </style>
</head>
<body class="bg-light">




    <!-- left-nav -->

    <aside class="app-sidebar bg-white border-end border-primary border-3">

        {% include 'components/left_nav.html' %}

    </aside>

    <main class="app-main bg-white border border-start-0 border-primary-subtle">

        <div class="main-board">

            <!-- topbar -->

            {% include 'components/topbar.html' %}


            <!-- MAIN CONTENT -->
            <div class="main-content">
                <div class="messages-wrapper">
                    <div class="messages-box">
                        <h4 class="fw-bold mb-3">Messages</h4>

                        <iframe
                            name="messagesFrame"
                            id="messagesFrame"
                            class="messages-frame"
                            src="{% url 'inbox' %}">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>



    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
