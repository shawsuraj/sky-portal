{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }

        .page-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .sidebar {
            width: 250px;
            min-height: 100%;
        }

        .main-content {
            flex: 1;
            padding: 24px;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .messages-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages-box {
            background: white;

            border: 1px solid #ddd;
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages-frame {
            width: 100%;
            flex: 1;
            min-height: 650px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            display: block;
        }

        footer {
            background: white;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <nav class="navbar px-4 border-bottom bg-white">
        <span>Sky Eng</span>
        <span>Notifications | Profile</span>
    </nav>

    <div class="page-body">

        <!-- SIDEBAR -->
        <div class="sidebar p-3 border-end bg-white">
            <h5 class="mb-4">NAVIGATION</h5>

            <p>Dashboard</p>
            <p>Teams</p>
            <p>Organisation</p>
            <p class="fw-bold">Messages</p>
            <p>Schedule</p>

            <hr>

            <p>Profile</p>
            <p>Settings</p>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="messages-wrapper">
                <div class="messages-box">
                    <h4 class="fw-bold mb-3">Messages</h4>

                    <iframe
                        name="messagesFrame"
                        id="messagesFrame"
                        class="messages-frame"
                        src="{% url 'inbox' %}">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center py-2 border-top">
        © 2026 Sky Engineering Directory
    </footer>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
