{% extends 'base.html' %}

{% load static %}

{% block content %}
    <style>
    .messages-wrapper {

        height: calc(100vh - 140px);

        min-height: 650px;

    }

    .messages-box {

        background: white;

        border: 1px solid #ddd;

        padding: 16px;

        height: 100%;

        display: flex;

        flex-direction: column;

    }

    .messages-frame {

        width: 100%;

        flex: 1;

        border: 1px solid #ddd;

        border-radius: 12px;

        background: white;

    }
    </style>

            <!-- MAIN CONTENT -->
            <div class="main-content">
                <div class="messages-wrapper">
                    <div class="messages-box">
                        <h4 class="fw-bold mb-3">Messages</h4>

                        <iframe
                            name="messagesFrame"
                            id="messagesFrame"
                            class="messages-frame"
                            src="{% url 'inbox' %}">
                        </iframe>
                    </div>
                </div>
            </div>
{% endblock %}
