<!DOCTYPE html>
<html>
<head>
    <title>Sky Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <style>
        /* will move to static at some point */
        html,
        body {
            height: 100%;
        }

        body {
            overflow: hidden;
        }

        .app-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 250px;
            height: 100vh;
            overflow-y: auto;
        }

        .app-main {
            margin-left: 250px;
            height: 100vh;
            overflow-y: auto;
        }

        .portal-sidebar {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        .portal-sidebar-inner {
            padding: 1rem 2rem;
            min-height: 100%;
        }

        .main-board {
            margin: 0;
            min-height: 100%;
        }

        .portal-search-wrap {
            max-width: 600px;
            width: 100%;
        }

        .portal-search-input {
            border: 2px solid #4b4b4b;
            font-size: 1rem;
        }

        .profile-avatar {
            width: 35px;
            height: 35px;
            border: 1px solid #4b4b4b;
            border-radius: 50%;
            background: #ffffff;
            display: inline-block;
        }

        @media (max-width: 1000px) {
            body {
                overflow: auto;
            }

            .app-sidebar {
                position: static;
                width: 100%;
                height: auto;
                overflow: visible;
            }

            .app-main {
                margin-left: 0;
                height: auto;
                overflow: visible;
            }

            .portal-sidebar {
                width: 100%;
                height: auto;
                min-height: auto;
            }
        }
    </style>
</head>

<body class="bg-light">

    <!-- left-nav -->
    <aside class="app-sidebar bg-white border-end border-primary border-3">
        {% include 'components/left_nav.html' %}
    </aside>

    <main class="app-main bg-white border border-start-0 border-primary-subtle">
        <div class="main-board">
            <!-- topbar -->
            {% include 'components/topbar.html' %}

            <div class="p-3 p-lg-4">
                <!-- 
                this block is for page specific content, your content will be added here.
                if any confusion, i'll expain in next tues meeting.
                -->
                {% block content %}
                    <h1> This is our BASE HTML. </h1>
                {% endblock %}
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
