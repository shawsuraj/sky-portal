<!-- Placeholder: teams page --><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teams Directory - OpenSky</title>
    <style>
        /* 1. Basic Page Setup */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            height: 100vh; /* Takes up full screen height */
        }

        /* 2. Sidebar Styles */
        .sidebar {
            width: 250px;
            background-color: #e0e0e0;
            padding: 20px;
            border-right: 1px solid #ccc;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
        }
        .nav-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #f4f4f4;
            border: 1px solid #333;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            color: #333;
        }
        .nav-btn.active {
            background-color: #ccc; /* Darker for the active 'Teams' page */
        }

        /* 3. Main Content Area */
        .main-content {
            flex-grow: 1; /* Takes up the rest of the space */
            display: flex;
            flex-direction: column;
        }

        /* 4. Header Styles */
        .header {
            background-color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
        }
        .header h1 {
            margin: 0;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 5. Toolbar (Search & Filters) */
        .toolbar {
            padding: 20px 40px;
            display: flex;
            gap: 20px;
        }
        .toolbar input, .toolbar select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-bar {
            flex-grow: 1; /* Makes the search bar wider */
            max-width: 400px;
        }

        /* 6. Grid for Team Cards */
        .teams-grid {
            padding: 0 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 equal columns */
            gap: 20px;
        }
        .card {
            background-color: #e0e0e0;
            height: 150px;
            border: 1px solid #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #aaa;
        }

        /* 7. Footer */
        .footer {
            margin-top: auto; /* Pushes footer to the bottom */
            text-align: center;
            padding: 20px;
            background-color: white;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <span>☒ OpenSky</span>
        </div>
        <a href="#" class="nav-btn">Dashboard</a>
        <a href="#" class="nav-btn active">Teams</a>
        <a href="#" class="nav-btn">Organisation</a>
        <a href="#" class="nav-btn">Messages</a>
        <a href="#" class="nav-btn">Schedule</a>
    </aside>

    <main class="main-content">
        
        <header class="header">
            <h1>Teams Directory</h1>
            <div class="user-profile">
                <span>🔔</span>
                <span>⊗ Jhon Doe ⌄</span>
            </div>
        </header>

        <div class="toolbar">
            <input type="text" class="search-bar" placeholder="Search teams 🔍">
            <select>
                <option>Department Filter</option>
            </select>
            <select>
                <option>Sort Filter</option>
            </select>
        </div>

        <div class="teams-grid">
            <div class="card">☒</div>
            <div class="card">☒</div>
            <div class="card">☒</div>
        </div>

        <footer class="footer">
            -------- Footer -------- Footer -------- Footer --------
        </footer>

    </main>

</body>
</html>
