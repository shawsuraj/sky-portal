<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sky Portal - Organisation</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<style>
		/*  draft styles */
		body {
			background: #F7FAFC;
			color: #000000;
		}

		/* main area for graph lib  */
		.map-box {
			width: 100%;
			height: 360px;
			border: 1px dashed #9fb0cd;
			border-radius: 0.5rem;
			display: grid;
			place-items: center;
			color: #50607b;
			background: #f9fbff;
		}
	</style>
</head>
<body>
	<main class="container py-4">
		<section class="mb-3">
			<h1 class="display-6 fw-bold mb-0">Dependency Map</h1>
			<p class="text-secondary mb-0">Initial layout for organisation page.</p>
		</section>

		<section class="row g-3">
			<article class="col-12 col-lg-8">
				<div class="card">
					<div class="card-body">
						<!-- left side map panel -->
						<h2 class="h5 mb-2">Map Area</h2>
						<div class="map-box">Graph area placeholder</div>
					</div>
				</div>
			</article>

			<aside class="col-12 col-lg-4">
				<div class="card">
					<div class="card-body">
						<!-- quick list panel to show team data for now -->
						<h3 class="h6">Teams</h3>
						<ul class="mb-3">
							<li>Core Team</li>
							<li>Frontend Team</li>
							<li>Backend Team</li>
							<li>Security Team</li>
						</ul>

						<h3 class="h6 mt-3">Dependencies</h3>
						<ul class="mb-0">
							<li>Core Team -> Frontend Team</li>
							<li>Core Team -> Backend Team</li>
							<li>Backend Team -> Security Team</li>
						</ul>
					</div>
				</div>
			</aside>
		</section>
	</main>
</body>
</html>
