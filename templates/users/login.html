<html>
<head>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

.login-container{
    width:400px;
    margin:80px auto;
}

h1{
    text-align:center;
    color:#1a73e8;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:10px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    background:#1a73e8;
    color:white;
    border:2px solid black;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{

    background:#1558b0;

    color:white;

}

.signup-link{
    text-align:center;
    margin-top:10px;
}

.message{
    color:#1a73e8;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}

.remember input{
    width:auto;
    margin:0;
}

.signup-button{
    width:100%;
    padding-top:10px;
    padding-bottom:10px;
    color:white;
    display:block;
    text-align:center;
    margin-top:12px;
    border:2px solid black;
    border-radius:6px;
    background:#1a73e8;
    text-decoration:none;
}

.signup-button:hover{
    background:#1558b0;
    color:white;
}

.admin-link{
    text-align:center;
    margin-top:10px;
}

.admin-button{
    width:100%;
    padding-top:10px;
    padding-bottom:10px;
    color:white;
    display:block;
    text-align:center;
    margin-top:12px;
    border:2px solid black;
    border-radius:6px;
    background:#1a73e8;
    text-decoration:none;
}

.admin-button:hover{
    background:#1558b0;
    color:white;
}

</style>

</head>

<body>

<div class="login-container">

<h1>Login</h1>

{% for message in messages %}
<p class="message">{{ message }}</p> <!--Displays any error messages-->
{% endfor %}

<form method="POST"> <!--Form-->
{% csrf_token %} 

<label>Username</label>
<input type="text" name="username" required>

<label>Password</label>
<input type="password" name="password" required>

<label class="remember" > <input type="checkbox"> Remember me </label> <!--Remember me checkbox-->

<button type="submit">Log in</button>

</form>

<br>
<br>

<div class="signup-link">
<p>Don't already have an account?</p>
<a href="{% url 'signup' %}" class="signup-button">Sign up</a> <!--Redirect user to sign up page-->
</div>

<br>

<div class="admin-link">
<p>Login to Admin?</p>
<a href="{% url 'admin:index' %}" class="admin-button">Admin</a> <!--Redirect user to admin page-->
</div>


</div>

</body>
</html>
