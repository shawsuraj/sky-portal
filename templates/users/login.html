<html>
<head>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

.login-container{
    width:300px;
    margin:100px auto;
    background:white;
    padding:20px;
    border:1px solid #ccc;
}

h1{
    text-align:center;
    color:#1a73e8;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:10px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:8px;
    background:#1a73e8;
    color:white;
    border:none;
}

.signup-link{
    text-align:center;
    margin-top:10px;
}

.message{
    color:red;
}

</style>

</head>

<body>

<div class="login-container">

<h1>Login</h1>

{% for message in messages %}
<p class="message">{{ message }}</p>
{% endfor %}

<form method="POST">
{% csrf_token %}

<label>Username</label>
<input type="text" name="username" required>

<label>Password</label>
<input type="password" name="password" required>

<button type="submit">Log in</button>

</form>

<div class="signup-link">
<p>Don't already have an account?</p>
<a href="{% url 'signup' %}">Sign up</a>
</div>

</div>

</body>
</html>
